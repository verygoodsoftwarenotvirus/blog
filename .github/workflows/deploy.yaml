on:
  push:
    branches:
      - main

name: Deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload built blog
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          retention-days: 1

  ru:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: website
          path: dist/

      # rsync -d mirrors the bucket to dist/ in a single pass: it adds and
      # overwrites before deleting what's gone, so the site is never empty
      # mid-deploy, and it succeeds against an empty bucket (unlike `rm **`).
      - name: Deploy website
        run: gsutil -m rsync -d -r dist/ gs://blog.verygoodsoftwarenotvirus.ru/
